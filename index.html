<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación Docente - Simulacro</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 30px;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 25px;
            color: var(--primary);
        }

        .question {
            margin-bottom: 25px;
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
        }

        .question p {
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 12px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option:hover {
            background: #f3f4f6;
        }

        .option.correct {
            background-color: #d1fae5 !important;
            border-color: var(--success) !important;
            color: #065f46;
            font-weight: bold;
        }

        .option.incorrect {
            background-color: #fee2e2 !important;
            border-color: var(--danger) !important;
            color: #991b1b;
        }

        .option input {
            cursor: pointer;
        }

        button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }

        .success-box {
            background-color: #ecfdf5;
            color: var(--success);
            border: 1px solid #a7f3d0;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1 id="quizTitle">🏆 Simulacro de Evaluación</h1>
    <form id="quizForm"></form>
    <div id="result" class="success-box"></div>
</div>

<script>
    const configuracionQuiz = {
        titulo: "📋 Simulacro Nombramiento Docente",

        // =========================================================================
        // ⭐⭐⭐ 1. IDENTIFICADOR DEL EXAMEN ⭐⭐⭐
        // IMPORTANTE: Cambia el "01" por "02", "03", etc., en cada nuevo examen 
        // para que no se quede bloqueado con las respuestas del día anterior.
        // =========================================================================
        idUnico: "simulacro_nombramiento_02", 

        // =========================================================================
        // 🛑 [INICIO DE SECCIÓN DE PREGUNTAS] - SOLO REEMPLAZAR ESTE BLOQUE 🛑
        // =========================================================================
    
            
                preguntas: [
            {
                enunciado: "1. Si al doble de la edad de un docente se le suma 12 años, se obtiene 76 años. ¿Cuál es la edad del docente?",
                alternativas: {
                    A: "A) 28 años",
                    B: "B) 32 años",
                    C: "C) 34 años",
                    D: "D) 30 años",
                    E: "E) 36 años"
                },
                correcta: "B"
            },
            {
                enunciado: "2. En una reunión pedagógica hay el doble de profesoras que de profesores. Si en total hay 72 docentes en la reunión, ¿cuántas profesoras asistieron?",
                alternativas: {
                    A: "A) 24 profesoras",
                    B: "B) 36 profesoras",
                    C: "C) 42 profesoras",
                    D: "D) 48 profesoras",
                    E: "E) 50 profesoras"
                },
                correcta: "D"
            },
            {
                enunciado: "3. El triple de un número, aumentado en su mitad, es igual a 70. ¿Cuál es el número?",
                alternativas: {
                    A: "A) 20",
                    B: "B) 15",
                    C: "C) 25",
                    D: "D) 18",
                    E: "E) 30"
                },
                correcta: "A"
            },
            {
                enunciado: "4. Un director compra cuadernos y lapiceros para sus docentes. Si el precio de un cuaderno cuesta el triple que el de un lapicero, y por un cuaderno y un lapicero juntos pagó 16 soles, ¿cuánto cuesta el cuaderno?",
                alternativas: {
                    A: "A) 4 soles",
                    B: "B) 8 soles",
                    C: "C) 12 soles",
                    D: "D) 10 soles",
                    E: "E) 14 soles"
                },
                correcta: "C"
            },
            {
                enunciado: "5. Tres especialistas de la UGEL se reparten un bono de 450 soles. Si el segundo recibe el doble que el primero, y el tercero recibe el triple que el primero, ¿cuántos soles recibió el segundo especialista?",
                alternativas: {
                    A: "A) 75 soles",
                    B: "B) 150 soles",
                    C: "C) 225 soles",
                    D: "D) 100 soles",
                    E: "E) 120 soles"
                },
                correcta: "B"
            }
        ]

        // =========================================================================
        // 🛑 [FIN DE SECCIÓN DE PREGUNTAS] - NO MODIFICAR NADA HACIA ABAJO 🛑
        // =========================================================================
    };

    // SISTEMA AUTOMÁTICO DE CARGA Y EVALUACIÓN (DEJAR IGUAL)
    const form = document.getElementById('quizForm');
    document.getElementById('quizTitle').textContent = configuracionQuiz.titulo;

    configuracionQuiz.preguntas.forEach((prog, index) => {
        const idPregunta = `q${index}`;
        let htmlOpciones = '';
        for (let letra in prog.alternativas) {
            htmlOpciones += `
                <label class="option">
                    <input type="radio" name="${idPregunta}" value="${letra}"> 
                    ${prog.alternativas[letra]}
                </label>`;
        }
        const divPregunta = document.createElement('div');
        divPregunta.className = 'question';
        divPregunta.innerHTML = `<p>${prog.enunciado}</p><div class="options">${htmlOpciones}</div>`;
        form.appendChild(divPregunta);
    });

    const botonEnvio = document.createElement('button');
    botonEnvio.type = "button";
    botonEnvio.id = "submitBtn";
    botonEnvio.textContent = "Enviar Respuestas";
    botonEnvio.onclick = calcularResultado;
    form.appendChild(botonEnvio);

    window.onload = function() {
        const yaRespondio = localStorage.getItem(`completado_${configuracionQuiz.idUnico}`);
        if (yaRespondio) {
            const notaGuardada = localStorage.getItem(`nota_${configuracionQuiz.idUnico}`);
            bloquearQuiz(notaGuardada);
        }
    };

    function calcularResultado() {
        let nota = 0;
        let respondidoAlgo = false;
        configuracionQuiz.preguntas.forEach((prog, index) => {
            if (form.elements[`q${index}`].value !== "") respondidoAlgo = true;
        });
        if (!respondidoAlgo) {
            alert("Por favor, marca al menos una respuesta antes de enviar.");
            return;
        }
        configuracionQuiz.preguntas.forEach((prog, index) => {
            const idPregunta = `q${index}`;
            const inputs = form.querySelectorAll(`input[name="${idPregunta}"]`);
            inputs.forEach(input => {
                if (input.checked) {
                    if (input.value === prog.correcta) {
                        input.parentElement.classList.add('correct');
                        nota++;
                    } else {
                        input.parentElement.classList.add('incorrect');
                    }
                }
            });
        });
        localStorage.setItem(`completado_${configuracionQuiz.idUnico}`, 'true');
        localStorage.setItem(`nota_${configuracionQuiz.idUnico}`, nota);
        bloquearQuiz(nota);
    }

    function bloquearQuiz(nota) {
        const total = configuracionQuiz.preguntas.length;
        const boton = document.getElementById('submitBtn');
        const contenedorResultado = document.getElementById('result');
        boton.disabled = true;
        boton.textContent = "Quiz Completado (Sin más intentos)";
        const inputs = form.querySelectorAll('input[type="radio"]');
        inputs.forEach(input => input.disabled = true);
        contenedorResultado.textContent = `Ya has completado esta evaluación. Tu resultado fue: ${nota} de ${total} correctas.`;
        contenedorResultado.style.display = 'block';
        contenedorResultado.scrollIntoView({ behavior: 'smooth' });
    }
</script>
</body>
</html>
